name: prek
permissions:
  contents: read
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly on Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run:
    name: Run hooks
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece  # v3.0.0

  update:
    name: Update hooks (7-day cooldown)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      # peter-evans/create-pull-request pushes the `update-pre-commit-hooks`
      # branch with the refreshed .pre-commit-config.yaml.
      contents: write  # Push to the `update-pre-commit-hooks` branch
      # ...and opens the pull request that proposes those revisions.
      pull-requests: write  # Open a pull request to propose revisions.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece  # v3.0.0
        with:
          install-only: true

      # `--cooldown-days 7` keeps hook releases newer than 7 days out of the
      # update, to blunt supply-chain attacks that publish and yank a bad tag.
      - name: Update hook revisions
        run: prek update --cooldown-days 7

      # create-pull-request wraps the branch push + PR open flow (with
      # delete-branch handling) that the runner does not provide natively.
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1 # zizmor: ignore[superfluous-actions]
        with:
          commit-message: "Update pre-commit hooks"
          add-paths: .pre-commit-config.yaml
          branch: update-pre-commit-hooks
          delete-branch: true
          title: "Update pre-commit hooks"
          body: "Automated update generated by `prek update --cooldown-days 7`."
          base: master
